name: Make Athar Clips Video

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install Pillow
          mkdir -p fonts
          curl -L -o fonts/NotoNaskhArabic-Bold.ttf "https://github.com/google/fonts/raw/main/ofl/notonaskharabic/NotoNaskhArabic%5Bwght%5D.ttf"
      - name: Make video
        run: python rickshaw_video.py
      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: rickshaw-video
          path: "*.mp4"
